# NovelVM update configuration.
#
# This file drives sync-upstream.sh (the upstream update workflow).
# See doc/updating.md for the full workflow description.

# Git remote name and expected URL for real upstream ScummVM.
SCUMMVM_REMOTE="scummvm"
SCUMMVM_REMOTE_URL="git@github.com:scummvm/scummvm.git"
SCUMMVM_BRANCH="master"

# Legacy full-history rewrite ref retained for inspecting the completed
# migration. sync-upstream.sh never regenerates or rebases onto it.
REWRITE_REF="refs/rewrites/scummvm-master"

# Path-rewrite tool (relative to repository root).
REWRITE_TOOL="devtools/rewrite-upstream-paths.py"

# NovelVM engine directories that must survive every update and are enabled
# by the default configure scan after upstream engines are removed.
# All other engines/<name>/ directories belong to upstream and are hidden
# from the working tree and removed from sync-commit trees.
NOVELVM_ENGINES="bibleblack koihime_doki smt"

# Sparse-checkout file used for engine filtering.
SPARSE_FILE=".git/info/sparse-checkout"

# Committed metadata identifying the old upstream snapshot used by the last
# incremental sync.
SYNC_METADATA_FILE=".novelvm-sync"
