# NovelVM update configuration.
#
# This file drives rebase.sh (the upstream update workflow).
# See doc/updating.md for the full workflow description.

# Git remote name and expected URL for real upstream ScummVM.
SCUMMVM_REMOTE="scummvm"
SCUMMVM_REMOTE_URL="git@github.com:scummvm/scummvm.git"
SCUMMVM_BRANCH="master"

# Ref where the path-rewritten (scummvm -> novelvm) upstream history is
# generated. This is a local, temporary ref; the real scummvm/<branch>
# remote-tracking ref is never modified.
REWRITE_REF="refs/rewrites/scummvm-master"

# Path-rewrite tool (relative to repository root).
REWRITE_TOOL="devtools/rewrite-upstream-paths.py"

# NovelVM engine directories that must survive every update.
# All other engines/<name>/ directories belong to upstream and are hidden
# from the working tree via sparse checkout (but stay in Git history).
PROTECTED_ENGINES="bibleblack koihime_doki smt"

# Sparse-checkout file used for engine filtering.
SPARSE_FILE=".git/info/sparse-checkout"
