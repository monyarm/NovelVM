name: Feature request
description: Suggest an improvement to NovelVM
title: ""
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem would this feature solve?
      placeholder: Describe the user need or outcome.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the proposed behavior and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternative solutions or workarounds have you considered?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the requirements that would make this feature complete.
      placeholder: |
        - The feature works across supported platforms
        - Existing behavior remains unchanged when it is not enabled
